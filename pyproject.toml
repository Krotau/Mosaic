[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mosaic"
version = "0.1.0"
description = "A phased data orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "pydantic-settings>=2.10",
    "structlog>=25.4",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "UP",
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]
